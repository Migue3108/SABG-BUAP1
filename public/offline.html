<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión | SABG-BUAP</title>
    <style>
        :root { --bg: #f5f7fa; --surface: #ffffff; --text: #1f2937; --muted: #6b7280; --primary: #315aa6; --border: #e5e7eb; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b1320; --surface: #111c2e; --text: #f3f4f6; --muted: #9ca3af; --primary: #4f85e2; --border: #1f2d44; }
        }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 480px; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }
        button { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>
            Esta sección aún no se ha guardado en este dispositivo. Abre el
            <strong>Dashboard</strong> con internet al menos una vez para descargar
            todos los capítulos. Tu avance guardado no se perdió.
        </p>
        <button type="button" onclick="location.href='/dashboard'">Ir al dashboard</button>
    </main>
</body>
</html>
